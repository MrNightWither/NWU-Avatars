<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>NWU Avatare – Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.vorschau { background: #101014 radial-gradient(ellipse at 30% 40%, #1d1c26 0%, #0a0a0c 70%); }
  canvas { display: block; }
  #hud {
    position: fixed; left: 12px; top: 12px; z-index: 2;
    font: 13px/1.45 Consolas, 'Courier New', monospace; color: #e8e8e8;
    background: rgba(13,13,16,0.82); border: 1px solid rgba(201,168,76,0.45);
    padding: 8px 12px; border-radius: 6px; pointer-events: none;
  }
  #hud b { color: #e8c96d; }
  #hud .klein { color: #8f8a80; font-size: 11px; margin-top: 4px; }
  #hud.aus { display: none; }
  /* Morrígans Prüfung */
  #pruefung {
    position: fixed; left: 50%; top: 4%; translate: -50% 0; z-index: 3; width: min(940px, 92vw);
    background: linear-gradient(rgba(14,10,22,0.95), rgba(8,6,12,0.95)); border: 3px solid #c9a84c; border-radius: 16px;
    padding: 18px 28px 22px; color: #f1e9d6; font: 26px/1.35 Georgia, 'Times New Roman', serif; text-align: center;
    box-shadow: 0 0 24px rgba(122,92,255,0.45); opacity: 0; transition: opacity 0.8s ease, translate 0.8s ease; pointer-events: none;
  }
  #pruefung.an { opacity: 1; translate: -50% 6px; }
  /* 20.10.2026: alles ~1,7× größer – im Stream (und am Handy) war der Befehl kaum lesbar */
  #pruefung .kopf { font: 700 20px/1 'Arial Narrow', Arial, sans-serif; letter-spacing: 0.3em; color: #e8c96d; text-transform: uppercase; }
  #pruefung .frage { font-size: 32px; font-style: italic; margin: 10px 0 14px; }
  #pruefung .antworten { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  #pruefung .antworten span { border: 2px solid rgba(201,168,76,0.6); border-radius: 8px; padding: 6px 16px; font-size: 26px; }
  #pruefung .antworten span.richtig { background: #c9a84c; color: #17120a; border-color: #e8c96d; }
  /* Die Zeile mit dem Befehl (!fang, !a/!b/!c …) ist das Wichtigste: gold, fett, mit Schatten */
  #pruefung .fuss { margin-top: 14px; font-size: 28px; font-weight: bold; color: #e8c96d; text-shadow: 0 2px 6px #000; }
  #pruefung .fuss:empty { display: none; }
  #pruefung .zeit { height: 6px; background: #7a5cff; margin-top: 14px; border-radius: 3px; transform-origin: left; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="pruefung" aria-live="polite"><div class="kopf">Morrígans Prüfung</div><div class="frage"></div><div class="antworten"></div><div class="fuss"></div><div class="zeit"></div></div>
<script src="lib/pixi.min.js"></script>
<script src="../data/haeuser.js"></script>
<script src="../data/aussehen.js"></script>
<script src="../data/ruhm.js"></script>
<script src="../data/welten.js"></script>
<script src="config.js"></script>
<script src="rig.js"></script>
<script src="rigs.js"></script>
<script src="chat.js"></script>
<script src="streamerbot.js"></script>
<script src="spiele.js"></script>
<script src="kampf.js"></script>
<script src="fluch.js"></script>
<script src="ruestung.js"></script>
<script src="avatare.js"></script>
</body>
</html>
